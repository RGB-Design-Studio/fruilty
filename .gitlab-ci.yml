stages:
  - deploy

deploy_production:
  stage: deploy
  only:
    - main

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client rsync

    # Prepare SSH
    - mkdir -p ~/.ssh
    - printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p 1222 209.182.234.23 >> ~/.ssh/known_hosts

  script:
    - rsync -avz --delete -e "ssh -p 1222" ./ administrator@209.182.234.23:/var/www/fruitly
